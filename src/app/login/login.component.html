<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page</title>
  <link rel="stylesheet" href="login.component.css">
</head>

<body class="login-page-background">

<div class="login-wrapper">
    <div class="login-box">
        <h2>Login</h2>
    
        <!-- Success Message -->
        <div *ngIf="successMessage" class="notification success">
        {{ successMessage }}
        </div>
    
        <!-- Error Message -->
        <div *ngIf="errorMessage" class="notification error">
        {{ errorMessage }}
        </div>
    
        <!-- Login Form -->
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    
        <!-- Email Field -->
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" formControlName="email" placeholder="Enter your email" (input)="clearMessages()">
            <div *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched" class="error-message">
            Valid email is required.
            </div>
        </div>
    
        <!-- Password Field -->
        <!-- <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" formControlName="password" placeholder="Enter your password" (input)="clearMessages()">
            <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="error-message">
            Password must be at least 6 characters.
            </div>
        </div> -->
    <!-- Password Field with Visibility Toggle -->
<div class="form-group">
    <label for="password">Password</label>
    <div style="position: relative;">
      <input
        [type]="showPassword ? 'text' : 'password'"
        id="password"
        formControlName="password"
        placeholder="Enter your password"
        (input)="clearMessages()"
      />
      <span
        class="eye-icon"
        style="position: absolute; top: 50%; right: 10px; transform: translateY(-50%); cursor: pointer;"
        (click)="togglePasswordVisibility()"
      >
        {{ showPassword ? '🙈' : '👁️' }}
      </span>
    </div>
    <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="error-message">
      Password must be at least 6 characters.
    </div>
  </div>
  
        <!-- Forgot Password Link -->
        <p class="forgot-password">
            <a [routerLink]="['/forgot-password']">Forgot Password?</a>
        </p>
    
        <!-- Submit Button -->
        <button type="submit" class="login-button" [disabled]="loginForm.invalid || loading">
            {{ loading ? 'Logging in...' : 'Login' }}
        </button>
        </form>
    </div>
    </div>

</body>

</html>
