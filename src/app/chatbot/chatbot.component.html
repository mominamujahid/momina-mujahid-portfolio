<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skinalyze Chatbot</title>
    <link rel="stylesheet" href="chatbot.component.css">
</head>

<body>

    <div class="chat-app">
        <!-- Sidebar -->
        <div class="sidebar">
          <h2>Chats</h2>
          <button class="new-chat-btn" (click)="startNewChat()">+ New Chat</button>
      
          <div class="chat-list">
            <div *ngFor="let chat of chatHistory; let i = index" class="chat-item" [class.active]="i === activeChatIndex">
              <span (click)="loadChat(i)">Chat {{ i + 1 }}</span>
              <button class="delete-btn" (click)="deleteChat(i)">🗑️</button>
            </div>
          </div>
        </div>
      
        <!-- Chat Area -->
        <div class="chat-container">
         
          <div class="chat-header">
            <h2><span style="font-size: 28px;">💬</span> Skinalyze Chatbot</h2>
          </div>
          <div class="chat-body">
            <div *ngFor="let message of messages" class="chat-message"
                 [ngClass]="{'user': message.sender === 'user', 'bot': message.sender === 'bot'}">
              <p>{{ message.text }}</p>
            </div>
          </div>
          <div class="chat-footer">
            <input type="text" [(ngModel)]="userInput" placeholder="Type your message..."
                   (keyup.enter)="sendMessage()">
            <button (click)="sendMessage()">Send</button>
          </div>
        </div>
      </div>

</body>

</html>
