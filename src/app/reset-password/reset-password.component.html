<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="reset-password.component.css">
</head>

<body>

<div class="reset-password-container">
    <h2>Reset Password</h2>
    <form [formGroup]="resetPasswordForm" (ngSubmit)="resetPassword()">
        <label for="newPassword">New Password:</label>
        <input type="password" formControlName="newPassword" required />

        <label for="confirmPassword">Confirm Password:</label>
        <input type="password" formControlName="confirmPassword" required />

        <p *ngIf="passwordMismatch" style="color: red;">Passwords do not match!</p>

        <button type="submit">Reset Password</button>
    </form>

    <p *ngIf="message">{{ message }}</p>
</div>

</body>

</html>
