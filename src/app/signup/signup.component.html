<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup Page</title>
    <link rel="stylesheet" href="signup.component.css">
</head>

<body>
    <div class="signup-wrapper">
    <div class="signup-box">
        <h2>Sign Up</h2>

        <!-- Notification Container -->
        <div class="notification-wrapper">
            <!-- Error Message -->
            <div *ngIf="errorMessage" class="notification error">
                {{ errorMessage }}
            </div>

            <!-- Success Message -->
            <div *ngIf="successMessage" class="notification success">
                {{ successMessage }}
            </div>
        </div>

        <!-- Signup Form -->
        <form (ngSubmit)="signup(signupForm)" #signupForm="ngForm">
            <!-- Name Field -->
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" [(ngModel)]="name" name="name" placeholder="Enter your full name" required
                    #nameField="ngModel" />
                <div *ngIf="nameField.invalid && nameField.touched" class="error-message">
                    Name is required
                </div>
            </div>

            <!-- Email Field -->
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" [(ngModel)]="email" name="email" placeholder="Enter your email" required
                    #emailField="ngModel" (ngModelChange)="validateEmail()" />

                <div *ngIf="emailField.invalid && emailField.touched" class="error-message">
                    Please enter a valid email
                </div>

                <div *ngIf="invalidEmail" class="error-message">
                    Enter a valid email (e.g., example&#64;gmail.com)
                </div>
            </div>



            <!-- Password Field -->
            <div class="form-group password-container">
                <label for="password">Create Password</label>
                <div class="password-wrapper">
                    <input [type]="showPassword ? 'text' : 'password'" id="password" [(ngModel)]="password"
                        name="password" placeholder="Create a strong password" required #passwordField="ngModel" />
                    <i class="eye-icon" [ngClass]="showPassword ? 'fa fa-eye' : 'fa fa-eye-slash'"
                        (click)="togglePasswordVisibility()">
                    </i>
                </div>
                <div *ngIf="passwordField.invalid && passwordField.touched" class="error-message">
                    Password is required
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="signup-button" [disabled]="signupForm.invalid">Sign Up</button>
        </form>

        <!-- Login Link -->
        <p>Already have an account? <a href="/login" routerLink="/login">Login here</a></p>
    </div>
</div>
</body>

</html>
